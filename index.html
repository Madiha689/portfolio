<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Madiha Rahman — Portfolio</title>

    <!-- Monochrome Grace Styles -->
    <link rel="stylesheet" href="Minimalist_Professional/Monochrome_Grace/css/index.css">
    <link rel="stylesheet" href="Minimalist_Professional/Monochrome_Grace/css/index-dark.css">
    <link rel="stylesheet" href="Minimalist_Professional/css/variables.css">
    <link rel="stylesheet" href="Minimalist_Professional/css/responsive-styles.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="#home"><i class="fas fa-house"></i> Home</a></li>
                <li><a href="#projects"><i class="fas fa-code"></i> Projects</a></li>
                <li><a href="#skills"><i class="fas fa-lightbulb"></i> Skills</a></li>
                <li><a href="#social"><i class="fas fa-share-alt"></i> Socials</a></li>
                <li><a href="#education"><i class="fas fa-graduation-cap"></i> Education</a></li>
                <li><a href="#hobbies"><i class="fas fa-heart"></i> Hobbies</a></li>
                <li><a id="dark-toggle"><i class="fas fa-moon"></i> Dark Mode</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- HOME -->
        <section id="home" class="section home-section">
            <h1 id="name"></h1>
            <p id="role"></p>
            <p id="bio"></p>
        </section>

        <!-- SOCIALS -->
        <section id="social" class="section social-section">
            <h2 class="section-heading">Social Links</h2>
            <div id="social-links"></div>
        </section>

        <!-- SKILLS -->
        <section id="skills" class="section skills-section">
            <h2 class="section-heading">Skills</h2>
            <ul id="skills-list"></ul>
        </section>

        <!-- PROJECTS -->
        <section id="projects" class="section projects-section">
            <h2 class="section-heading">Projects</h2>
            <div id="projects-list" class="projects-list"></div>
        </section>

        <!-- EDUCATION -->
        <section id="education" class="section education-section">
            <h2 class="section-heading">Education</h2>
            <div id="education-table"></div>
        </section>

        <!-- HOBBIES -->
        <section id="hobbies" class="section hobbies-section">
            <h2 class="section-heading">Hobbies & Interests</h2>
            <ul id="hobbies-list"></ul>
        </section>

    </main>

    <!-- JS Loader -->
    <script src="js/index.js"></script>

    <!-- Dark Mode Toggle -->
    <script>
        const toggle = document.getElementById("dark-toggle");
        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>

</body>

<footer class="footer">
    <p>&copy; <span id="footer-year"></span> Madiha Rahman. All rights reserved.</p>
</footer>

<script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();
</script>

</html>
